[package]
name = "blitz-dom"
description = "Blitz DOM implementation"
documentation = "https://docs.rs/blitz-dom"
version = "0.3.0-beta.4"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
default = [
    "svg",
    "woff",
    "accessibility",
    "system-fonts",
    "file-input",
    "custom-widget",
    "text-transform-icu"
]
custom-widget = ["dep:anyrender", "accessibility"]
tracing = ["dep:tracing"]
svg = ["dep:usvg", "dep:svgtypes"]
# WOFF decoding (using the "wuff" crate which is pure Rust)
woff = ["dep:wuff"]
accessibility = ["accesskit"]
system-fonts = ["parley/system"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["parley/complex-scripts"]
# text-transform-icu: language-aware, Unicode-complete case mapping for `text-transform`
# (otherwise falls back to the standard library's case mapping)
text-transform-icu = ["dep:icu_casemap", "dep:writeable"]
autofocus = []
floats = ["taffy/float_layout", "stylo_taffy/floats"]
# CSS vertical `writing-mode` support (layout runs in each box's writing-mode frame; see layout/writing_mode.rs)
writing-mode = ["stylo_taffy/writing-mode"]
file-input = []
# Overlay-scrollbar thumb interaction (drag + hover tracking). Normally
# enabled through `blitz-paint/scrollbars`, which paints the thumbs.
scrollbars = []
parallel-construct = []
log-phase-times = ["debug_timer/enable"]

[dependencies]
# Blitz dependencies
blitz-traits = { version = "=0.3.0-beta.4", default-features = false, git = "https://github.com/DioxusLabs/blitz", rev = "f8723f495c7c6bfb611a923a21ed5c8e0fe95d55" }
stylo_taffy = { version = "=0.3.0-beta.4", default-features = false, git = "https://github.com/DioxusLabs/blitz", rev = "f8723f495c7c6bfb611a923a21ed5c8e0fe95d55", features = ["default"] }
debug_timer = { version = "0.1.2", git = "https://github.com/DioxusLabs/blitz", rev = "f8723f495c7c6bfb611a923a21ed5c8e0fe95d55" }

# Servo dependencies
style = { version = "0.22.0", package = "stylo" }
selectors = { version = "0.41.0", package = "selectors" }
cssparser = { version = "0.38.0" }
style_config = { version = "0.22.0", package = "stylo_static_prefs" }
style_traits = { version = "0.22.0", package = "stylo_traits" }
style_dom = { version = "0.22.0", package = "stylo_dom" }
app_units = { version = "0.7.5" }
euclid = { version = "0.22" }
atomic_refcell = { version = "0.1.13" }
markup5ever = { version = "0.40.0" }
smallvec = { version = "1" }
thin-vec = { version = "0.2" }

# DioxusLabs dependencies
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "4e59968eda29ceeb0bbaeb3993c8cd38baa3d0a6", default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
anyrender = { version = "0.14.0", optional = true }

# Linebender/Fontations dependencies
accesskit = { version = "0.25", optional = true }
parley = { version = "0.12", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
linebender_resource_handle = { version = "0.1" }
color = { version = "0.3" }
kurbo = { version = "0.13.1" }

# Unicode
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
icu_locale_core = { version = "2.3", default-features = false }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
writeable = { version = "0.6", default-features = false, optional = true }

# Other dependencies
slotmap = { version = "1.0.7" }
bitflags = { version = "2.8.0" }
tracing = { version = "0.1.40", optional = true }
rayon = { version = "1" }

# Media & Decoding
image = { version = "0.25.6", default-features = false }
usvg = { version = "0.48.1", optional = true }
svgtypes = { version = "0.16.1", optional = true }
wuff = { version = "0.2", optional = true }
html-escape = { version = "0.2.13" }
percent-encoding = { version = "2.3.1" }

# IO & Networking
url = { version = "2.5.0" }

# Input
keyboard-types = { version = "0.8" }
cursor-icon = { version = "1" }
thread_local = { version = "1" }

# WASM
web-time = { version = "1" }

# HACK: Blitz doesn't need to depend on objc2 directly. But this feature flag is necessary
# to prevent debug builds from panicking.
[target.'cfg(any(target_vendor = "apple"))'.dependencies]
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
